<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Tarefas</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <header class="header">
        <div class="logo">Projeto web</div>
    </header>

    <main class="dashboard">

        <section class="dashboard-header">
            <h1>Gerenciador de Tarefas</h1>
            <p>
                Organize suas atividades e acompanhe seu progresso.
            </p>
        </section>

        <section class="stats">

            <article class="stat-card">
            <h3>Total de tarefas</h3>
            <p id="totalTasks">0</p>
            </article>
            <article class="stat-card">
            <h3>Pendentes</h3>
            <p id="pendingTasks">0</p>
            </article>

            <article class="stat-card">
            <h3>Concluídas</h3>
            <p id="completedTasks">0</p>
            </article>
        </section>

        <section class="task-section">

            <h2>Adicionar nova tarefa</h2>

            <form id="taskForm">

                <div class="form-group">
                    <label for="taskName">Nome da tarefa</label>

                    <input
                        type="text"
                        id="taskName"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="taskPriority">Prioridade</label>

                    <select id="taskPriority">
                        <option value="Baixa">Baixa</option>
                        <option value="Média" selected>Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>

                <button type="submit" class="btn">
                    Adicionar tarefa
                </button>
            </form>
        </section>
        <section class="task-section">

            <h2>Minhas tarefas</h2>

            <div class="filters">
                <button type="button" class="filter-btn active" data-filter="all">
                    Todas
                </button>

                <button type="button" class="filter-btn" data-filter="pending">
                    Pendentes
                </button>

                <button type="button" class="filter-btn" data-filter="completed">
                    Concluídas
                </button>
            </div>

            <div id="taskList" class="task-list">
                <!-- Tarefas adicionadas pelo JavaScript -->
            </div>

        </section>
    </main>

    <footer>
        <p>Gerenciador de Tarefas 2026</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
